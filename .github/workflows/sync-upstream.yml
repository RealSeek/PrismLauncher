name: Sync Upstream

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/PrismLauncher/PrismLauncher.git

      - name: Fetch upstream
        run: git fetch upstream develop

      - name: Check if update needed
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/develop)
          MERGE_BASE=$(git merge-base HEAD upstream/develop)
          if [ "$MERGE_BASE" = "$UPSTREAM" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits."
          fi

      - name: Rebase onto upstream
        if: steps.check.outputs.skip == 'false'
        id: rebase
        run: |
          if git rebase upstream/develop; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Force push
        if: steps.check.outputs.skip == 'false' && steps.rebase.outputs.success == 'true'
        run: git push --force-with-lease origin develop

      - name: Warn on conflict
        if: steps.check.outputs.skip == 'false' && steps.rebase.outputs.success == 'false'
        run: |
          echo "::warning::Upstream sync conflict detected. Manual rebase required: git fetch upstream develop && git rebase upstream/develop"
          exit 1
