name: Sync Upstream

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/PrismLauncher/PrismLauncher.git

      - name: Fetch upstream
        run: git fetch upstream develop

      - name: Check if update needed
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/develop)
          MERGE_BASE=$(git merge-base HEAD upstream/develop)
          if [ "$MERGE_BASE" = "$UPSTREAM" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits."
          fi

      - name: Rebase onto upstream
        if: steps.check.outputs.skip == 'false'
        id: rebase
        run: |
          if git rebase upstream/develop; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Force push
        if: steps.check.outputs.skip == 'false' && steps.rebase.outputs.success == 'true'
        run: git push --force-with-lease origin develop

      - name: Create issue on conflict
        if: steps.check.outputs.skip == 'false' && steps.rebase.outputs.success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ Upstream sync conflict - ${new Date().toISOString().slice(0, 10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Conflict still present as of ${new Date().toISOString().slice(0, 10)}. Please resolve manually.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['sync-conflict'],
                body: [
                  '## Upstream Sync Failed',
                  '',
                  'Automatic rebase of `upstream/develop` onto `develop` failed due to conflicts.',
                  '',
                  '### Manual resolution',
                  '```bash',
                  'git remote add upstream https://github.com/PrismLauncher/PrismLauncher.git',
                  'git fetch upstream develop',
                  'git rebase upstream/develop',
                  '# resolve conflicts...',
                  'git rebase --continue',
                  'git push --force-with-lease origin develop',
                  '```',
                ].join('\n'),
              });
            }
